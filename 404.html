<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <title>Page not found — Panchal Motors layouts</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f2; color: #16181b; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    h1 { font-size: 2rem; margin: 0 0 8px; letter-spacing: -.02em; }
    p { color: #52565d; margin: 0 0 24px; }
    a { display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 10px; background: #16181b; color: #fff; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #c2410c; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That layout address doesn't exist. Layouts are numbered 00 to 14.</p>
    <a id="home" href="/">← All layouts</a>
  </main>
  <script>
    // On a GitHub Pages project site the gallery lives under /<repo>/.
    if (/\.github\.io$/.test(location.hostname)) {
      var seg = location.pathname.split("/")[1];
      if (seg) document.getElementById("home").href = "/" + seg + "/";
    }
  </script>
</body>
</html>
